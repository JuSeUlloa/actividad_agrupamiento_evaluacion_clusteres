[project]
name = "actividad-agrupamiento-evaluacion-clusteres"
version = "0.1.0"
description = "Agrupamiento y evaluación de clústeres: jerárquico, K-Means y K-Medoides sobre datos morfométricos de ranas"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0,<2",
    "scikit-learn>=1.5.0",
    "scipy>=1.13.0",
    "scikit-learn-extra>=0.3.0",
    "openpyxl>=3.1.0",
    "matplotlib>=3.9.0",
    "seaborn>=0.13.0",
    "setuptools>=84.0.0",
]
